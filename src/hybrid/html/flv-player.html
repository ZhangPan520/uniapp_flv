<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FLV Live Player</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0b0b0d;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      position: fixed;
      inset: 0;
    }
    #video {
      width: 100%;
      height: 100%;
      background: #0b0b0d;
      object-fit: contain;
      /* video 本身不需要接收任何交互，点击热区统一由 #tapLayer 承担，
         必须保留这个属性，否则浏览器内核会认为 video 是"可交互元素"，
         重新画出它自己的原生播放遮罩（一个不受 CSS 隐藏规则控制的巨大圆环+三角形） */
      pointer-events: none;
      -webkit-user-drag: none;
      user-select: none;
    }
    #placeholder {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(.72) contrast(1.06) brightness(.58);
      transform: scale(1.03);
    }
    /* 隐藏 Chromium/Android WebView 给空的 <video> 元素自动叠加的原生播放遮罩按钮 */
    video::-webkit-media-controls,
    video::-webkit-media-controls-enclosure,
    video::-webkit-media-controls-panel,
    video::-webkit-media-controls-play-button,
    video::-webkit-media-controls-start-playback-button,
    video::-webkit-media-controls-overlay-play-button,
    video::-webkit-media-controls-overlay-enclosure {
      display: none !important;
      -webkit-appearance: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
    #tapLayer {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }
    /* 播放前的封面态：深色渐变背景 + 居中播放按钮，直播场景没有素材可以提前截帧
       （还没开始拉流，没有画面数据），用精心设计的空状态代替，而不是浏览器默认的丑陋图标 */
    #cover {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      /* 必须比 #tapLayer 的 z-index 更高：封面显示期间要拦截点击触发播放，
         而不是被 tapLayer 抢先拦截去做"切换控制层显示"（那个逻辑只在播放中才有意义） */
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(9, 12, 11, .28);
    }
    #coverPlayBtn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }
    #coverPlayBtn svg {
      width: 26px;
      height: 26px;
      fill: #ffffff;
      margin-left: 2px;
    }
    #coverText {
      color: rgba(255, 255, 255, 0.75);
      font-size: 13px;
      letter-spacing: 0.5px;
    }
    /* Loading 层：点击播放后、拿到第一帧画面前显示 */
    #loading {
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      z-index: 7;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(11, 11, 13, 0.65);
    }
    #loadingSpinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    #loadingText {
      color: rgba(255, 255, 255, 0.75);
      font-size: 12px;
    }
    #tip {
      position: fixed;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      text-align: center;
      color: #fff;
      font-size: 14px;
      padding: 0 20px;
      display: none;
      pointer-events: none;
      z-index: 8;
    }
    #fullscreenControls {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      pointer-events: none;
    }
    .external-fullscreen #fullscreenControls {
      display: block;
    }
    .fullscreen-top,
    .fullscreen-bottom {
      position: absolute;
      left: max(16px, env(safe-area-inset-left));
      right: max(16px, env(safe-area-inset-right));
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
      opacity: 1;
      transition: opacity .18s ease, transform .2s ease;
      pointer-events: none;
    }
    .fullscreen-top { top: max(16px, env(safe-area-inset-top)); }
    .fullscreen-bottom { bottom: max(16px, env(safe-area-inset-bottom)); }
    .fullscreen-meta {
      display: flex;
      align-items: center;
      gap: 9px;
    }
    .fullscreen-pill {
      height: 28px;
      padding: 0 9px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 5px;
      background: rgba(12,15,14,.66);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      pointer-events: auto;
    }
    .fullscreen-live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff5b47;
      box-shadow: 0 0 0 3px rgba(229,73,54,.2);
    }
    #fullscreenTimestamp {
      font: 600 11px/1.4 "SFMono-Regular", Consolas, monospace;
      text-shadow: 0 1px 5px #000;
    }
    .fullscreen-actions { display: flex; gap: 6px; pointer-events: auto; }
    .fullscreen-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: rgba(12,15,14,.68);
      backdrop-filter: blur(8px);
    }
    .fullscreen-button svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .fullscreen-button .fill-icon { fill: currentColor; stroke: none; }
    .fullscreen-back svg { width: 22px; height: 22px; }
    .fullscreen-controls-hidden .fullscreen-top {
      opacity: 0;
      transform: translateY(-6px);
    }
    .fullscreen-controls-hidden .fullscreen-bottom {
      opacity: 0;
      transform: translateY(6px);
    }
    .fullscreen-controls-hidden .fullscreen-button,
    .fullscreen-controls-hidden .fullscreen-pill {
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!-- 直播流地址：拿到具体地址后只需要改这一行 -->
  <script>
    window.FLV_URL = 'https://srs.unsj.edu.ar/live/xama/xama.flv';
  </script>

  <video id="video" playsinline webkit-playsinline></video>
  <img id="placeholder" src="./monitor-office.jpg" alt="客厅摄像头画面" />

  <!-- 封面态：播放前显示，点击后淡出并开始拉流 -->
  <div id="cover">
    <div id="coverPlayBtn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </div>
    <div id="coverText">点击播放直播</div>
  </div>

  <!-- Loading 态：点击播放后、拿到首帧画面前显示 -->
  <div id="loading">
    <div id="loadingSpinner"></div>
    <div id="loadingText">正在连接直播...</div>
  </div>

  <div id="tapLayer"></div>
  <div id="tip"></div>

  <div id="fullscreenControls" aria-hidden="true">
    <div class="fullscreen-top">
      <button id="fullscreenBackBtn" class="fullscreen-button fullscreen-back" aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <span class="fullscreen-pill">高清 1080P</span>
    </div>
    <div class="fullscreen-bottom">
      <div class="fullscreen-meta">
        <span id="fullscreenTimestamp">--</span>
        <span class="fullscreen-pill"><span class="fullscreen-live-dot"></span>实时</span>
      </div>
      <div class="fullscreen-actions">
        <button id="fullscreenPlayBtn" class="fullscreen-button" aria-label="播放或暂停">
          <svg id="fullscreenPlayIcon" viewBox="0 0 24 24"><path class="fill-icon" d="M8 5v14l11-7z"/></svg>
          <svg id="fullscreenPauseIcon" viewBox="0 0 24 24" style="display:none"><path d="M7 5v14M17 5v14"/></svg>
        </button>
        <button id="fullscreenExitBtn" class="fullscreen-button" aria-label="退出全屏">
          <svg viewBox="0 0 24 24"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="./uni.webview.1.5.8.js"></script>
  <script src="./flv.min.js"></script>
  <script>
    (function () {
      var videoEl = document.getElementById('video');
      var placeholderEl = document.getElementById('placeholder');
      var tipEl = document.getElementById('tip');
      var tapLayerEl = document.getElementById('tapLayer');
      var coverEl = document.getElementById('cover');
      var loadingEl = document.getElementById('loading');
      var fullscreenControlsEl = document.getElementById('fullscreenControls');
      var fullscreenPlayIconEl = document.getElementById('fullscreenPlayIcon');
      var fullscreenPauseIconEl = document.getElementById('fullscreenPauseIcon');
      var fullscreenTimestampEl = document.getElementById('fullscreenTimestamp');
      var flvUrl = window.FLV_URL;
      var player = null;
      var retryTimer = null;
      var retryCount = 0;
      var MAX_RETRY = 5;
      var started = false; // 是否已经开始过播放，控制是否允许自动重试
      var isPlaying = false;
      var isExternalFullscreen = false;
      var fullscreenControlsVisible = true;
      var fullscreenControlsTimer = null;

      function showTip(text) {
        tipEl.textContent = text;
        tipEl.style.display = text ? 'block' : 'none';
      }

      function hideCover() {
        coverEl.style.display = 'none';
        placeholderEl.style.display = 'none';
      }

      function showCover() {
        coverEl.style.display = 'flex';
        placeholderEl.style.display = 'block';
        hideLoading();
      }

      function showLoading() {
        coverEl.style.display = 'none';
        placeholderEl.style.display = 'block';
        loadingEl.style.display = 'flex';
      }

      function hideLoading() {
        loadingEl.style.display = 'none';
      }

      function setFullscreenPlayIcon() {
        fullscreenPlayIconEl.style.display = isPlaying ? 'none' : '';
        fullscreenPauseIconEl.style.display = isPlaying ? '' : 'none';
      }

      function clearFullscreenControlsTimer() {
        if (fullscreenControlsTimer) {
          clearTimeout(fullscreenControlsTimer);
          fullscreenControlsTimer = null;
        }
      }

      function showFullscreenControls() {
        fullscreenControlsVisible = true;
        document.body.classList.remove('fullscreen-controls-hidden');
        clearFullscreenControlsTimer();
        if (isExternalFullscreen && isPlaying) {
          fullscreenControlsTimer = setTimeout(hideFullscreenControls, 3000);
        }
      }

      function hideFullscreenControls() {
        fullscreenControlsVisible = false;
        document.body.classList.add('fullscreen-controls-hidden');
        clearFullscreenControlsTimer();
      }

      function setExternalFullscreen(enabled) {
        isExternalFullscreen = enabled;
        document.body.classList.toggle('external-fullscreen', enabled);
        fullscreenControlsEl.setAttribute('aria-hidden', enabled ? 'false' : 'true');
        if (enabled) showFullscreenControls();
        else {
          document.body.classList.remove('fullscreen-controls-hidden');
          clearFullscreenControlsTimer();
        }
      }

      function notifyApp(type, detail) {
        // 通过 uni.postMessage 把状态上报给外层 uni-app 页面（nvue 页面用 @onPostMessage 接收）
        try {
          if (window.uni && typeof window.uni.postMessage === 'function') {
            window.uni.postMessage({ data: { type: type, detail: detail } });
          }
        } catch (e) {
          // 忽略桥不存在的情况
        }
      }

      function destroyPlayer() {
        if (player) {
          try {
            player.pause();
            player.unload();
            player.detachMediaElement();
            player.destroy();
          } catch (e) {
            // ignore
          }
          player = null;
        }
      }

      function createPlayer() {
        if (!window.flvjs || !window.flvjs.isSupported()) {
          showTip('当前浏览器内核不支持 flv.js 播放（需要 MSE 支持）');
          showCover();
          notifyApp('unsupported');
          return;
        }
        if (!flvUrl || flvUrl.indexOf('your-flv-stream-url') !== -1) {
          showTip('请先设置正确的直播流地址（FLV_URL）');
          showCover();
          notifyApp('play_rejected', 'invalid url');
          return;
        }

        destroyPlayer();
        showTip('');
        showLoading();

        player = window.flvjs.createPlayer(
          {
            type: 'flv',
            isLive: true,
            url: flvUrl,
          },
          {
            enableStashBuffer: false, // 直播场景关闭缓冲，降低延迟
            stashInitialSize: 128,
            autoCleanupSourceBuffer: true,
          }
        );

        player.attachMediaElement(videoEl);

        // 拿到第一帧真实画面数据时才隐藏 loading，比 play() 的 Promise resolve 更准确
        videoEl.addEventListener('loadeddata', function onFirstFrame() {
          hideLoading();
          notifyApp('first_frame');
        }, { once: true });

        player.on(window.flvjs.Events.ERROR, function (errType, errDetail) {
          console.error('[flv.js error]', errType, errDetail);
          isPlaying = false;
          setFullscreenPlayIcon();
          notifyApp('error', { errType: errType, errDetail: errDetail });
          showCover();
          scheduleRetry();
        });

        player.on(window.flvjs.Events.LOADING_COMPLETE, function () {
          notifyApp('loading_complete');
        });

        player.on(window.flvjs.Events.RECOVERED_EARLY_EOF, function () {
          notifyApp('recovered_early_eof');
        });

        player.load();
        player
          .play()
          .then(function () {
            retryCount = 0;
            isPlaying = true;
            setFullscreenPlayIcon();
            hideCover();
            showFullscreenControls();
            notifyApp('play_success');
          })
          .catch(function (err) {
            console.warn('[flv.js] play() rejected', err);
            isPlaying = false;
            setFullscreenPlayIcon();
            showCover();
            notifyApp('play_rejected', String(err));
          });
      }

      function scheduleRetry() {
        if (!started) return; // 还没开始播放过，不自动重试
        if (retryTimer) return;
        if (retryCount >= MAX_RETRY) {
          showTip('播放失败，请检查网络或直播源');
          return;
        }
        retryCount += 1;
        showTip('连接中断，正在重试 (' + retryCount + '/' + MAX_RETRY + ')...');
        retryTimer = setTimeout(function () {
          retryTimer = null;
          createPlayer();
        }, 2000);
      }

      function startPlay() {
        started = true;
        if (!player) {
          createPlayer();
        } else {
          showLoading();
          player
            .play()
            .then(function () {
              isPlaying = true;
              setFullscreenPlayIcon();
              hideCover();
              hideLoading();
              showFullscreenControls();
              notifyApp('play_success');
            })
            .catch(function (err) {
              isPlaying = false;
              setFullscreenPlayIcon();
              showCover();
              notifyApp('play_rejected', String(err));
            });
        }
      }

      function pausePlay() {
        if (player) {
          player.pause();
        }
        isPlaying = false;
        setFullscreenPlayIcon();
        showFullscreenControls();
        showCover();
        notifyApp('paused');
      }

      // 注意：这里不再调用 video.requestFullscreen()。原因是这个网页运行在 nvue 里的
      // <web-view> 组件内部，该组件在布局中只占据中间的 flex 区域（不是全屏），网页内部的
      // Fullscreen API 顶多让视频铺满这个 web-view 自身的区域，无法突破组件边界盖住外层的
      // 导航栏和控制栏。真正的全屏效果由外层 nvue 页面动态调整 web-view 的布局样式实现。

      // 接收外层 nvue 页面通过 evalJS 派发的指令：play / pause
      window.addEventListener('uni-app-command', function (e) {
        var action = e && e.detail && e.detail.action;
        if (action === 'play') {
          startPlay();
        } else if (action === 'pause') {
          pausePlay();
        } else if (action === 'fullscreen_enter') {
          setExternalFullscreen(true);
        } else if (action === 'fullscreen_exit') {
          setExternalFullscreen(false);
        }
      });

      // 点击封面直接开始播放
      coverEl.addEventListener('click', startPlay);

      // 点击视频区域（已经在播放时），通知外层切换导航栏/控制栏的显示状态（哔哩哔哩风格交互）
      tapLayerEl.addEventListener('click', function () {
        if (isExternalFullscreen) {
          fullscreenControlsVisible ? hideFullscreenControls() : showFullscreenControls();
        } else {
          notifyApp('toggle_controls');
        }
      });

      document.getElementById('fullscreenPlayBtn').addEventListener('click', function (e) {
        e.stopPropagation();
        isPlaying ? pausePlay() : startPlay();
      });
      document.getElementById('fullscreenBackBtn').addEventListener('click', function (e) {
        e.stopPropagation();
        notifyApp('request_fullscreen_exit');
      });
      document.getElementById('fullscreenExitBtn').addEventListener('click', function (e) {
        e.stopPropagation();
        notifyApp('request_fullscreen_exit');
      });

      function updateFullscreenTimestamp() {
        var now = new Date();
        var pad = function (value) { return String(value).padStart(2, '0'); };
        fullscreenTimestampEl.textContent = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) + '  ' + pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
      }
      updateFullscreenTimestamp();
      setInterval(updateFullscreenTimestamp, 1000);

      document.addEventListener('touchmove', function (event) {
        event.preventDefault();
      }, { passive: false });
      document.addEventListener('dragstart', function (event) {
        event.preventDefault();
      });

      // 支持通过 URL query 参数动态传入播放地址，例如：
      // /hybrid/html/flv-player.html?url=https%3A%2F%2Fxxx.flv
      function readUrlFromQuery() {
        try {
          var params = new URLSearchParams(window.location.search);
          var u = params.get('url');
          if (u) {
            flvUrl = decodeURIComponent(u);
          }
        } catch (e) {
          // ignore
        }
      }

      readUrlFromQuery();

      document.addEventListener('visibilitychange', function () {
        if (!started) return;
        if (document.hidden) {
          if (player) player.pause();
        } else {
          if (player) player.play().catch(function () {});
        }
      });
    })();
  </script>
</body>
</html>
