<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>客厅摄像头</title>
  <style>
    :root { --ink:#161818; --muted:#737977; --line:#e5e8e6; --surface:#f5f7f5; --paper:#fff; --stage:#111413; --live:#e54936; --online:#28a06a; --status:0px; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:var(--surface); color:var(--ink); font-family:"Avenir Next","PingFang SC","Microsoft YaHei",sans-serif; letter-spacing:0; }
    button { padding:0; border:0; color:inherit; background:none; font:inherit; }
    #app { position:fixed; inset:0; display:flex; flex-direction:column; background:var(--surface); }
    #header { flex:0 0 calc(64px + var(--status)); padding:var(--status) 10px 0; display:grid; grid-template-columns:48px 1fr 48px; align-items:center; color:#fff; background:var(--stage); }
    .icon-button { width:44px; height:44px; display:grid; place-items:center; border-radius:50%; }
    .icon-button:active,.action:active,.step-button:active { transform:scale(.94); }
    .icon { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
    .title { min-width:0; text-align:center; }
    .title strong,.title span { display:block; }
    .title strong { font-size:16px; line-height:21px; font-weight:700; }
    .title span { overflow:hidden; color:rgba(255,255,255,.58); font-size:11px; line-height:16px; text-overflow:ellipsis; white-space:nowrap; }
    #viewer { position:relative; flex:0 0 min(72.82vw,284px); min-height:210px; overflow:hidden; background:#131615; }
    #video { width:100%; height:100%; display:block; object-fit:cover; background:#111413; pointer-events:none; }
    video::-webkit-media-controls,video::-webkit-media-controls-enclosure,video::-webkit-media-controls-panel,video::-webkit-media-controls-play-button,video::-webkit-media-controls-start-playback-button,video::-webkit-media-controls-overlay-play-button { display:none!important; opacity:0!important; pointer-events:none!important; }
    #placeholder { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:saturate(.72) contrast(1.06) brightness(.58); transform:scale(1.03); }
    #shade { position:absolute; inset:0; background:linear-gradient(to bottom,rgba(9,12,11,.22),transparent 30%,transparent 60%,rgba(9,12,11,.62)); pointer-events:none; }
    #tapLayer { position:absolute; inset:0; z-index:2; }
    .video-top,.video-bottom { position:absolute; left:14px; right:14px; z-index:5; display:flex; align-items:center; justify-content:space-between; color:#fff; transition:opacity .18s ease,transform .2s ease; }
    .video-top { top:14px; }.video-bottom { bottom:13px; }
    .pill { min-height:26px; padding:0 8px; display:inline-flex; align-items:center; gap:6px; border:1px solid rgba(255,255,255,.13); border-radius:5px; background:rgba(12,15,14,.6); backdrop-filter:blur(8px); color:#fff; font-size:11px; font-weight:700; }
    .live-dot { width:6px; height:6px; border-radius:50%; background:#ff5b47; box-shadow:0 0 0 3px rgba(229,73,54,.2); }
    .video-meta { display:flex; align-items:center; gap:9px; }
    #timestamp { font:600 11px/1.4 "SFMono-Regular",Consolas,monospace; text-shadow:0 1px 5px #000; }
    .fullscreen-only { display:none; }
    .video-actions { display:flex; gap:4px; }
    .video-actions .icon-button { width:38px; height:38px; background:rgba(12,15,14,.54); backdrop-filter:blur(8px); }
    #cover,#loading { position:absolute; inset:0; z-index:4; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; }
    #coverPlay { width:62px; height:62px; margin-bottom:12px; display:grid; place-items:center; border:1px solid rgba(255,255,255,.22); border-radius:50%; background:rgba(12,15,14,.62); backdrop-filter:blur(8px); }
    #coverPlay .icon { width:26px; height:26px; margin-left:3px; fill:#fff; stroke:none; }
    #coverText,#loadingText { color:rgba(255,255,255,.78); font-size:12px; }
    #loading { display:none; background:rgba(11,11,13,.66); }
    #spinner { width:32px; height:32px; margin-bottom:12px; border:3px solid rgba(255,255,255,.24); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    #tip { position:absolute; left:24px; right:24px; top:50%; z-index:8; display:none; color:#fff; font-size:13px; text-align:center; transform:translateY(-50%); }
    #content { flex:1; min-height:0; overflow:auto; padding:14px 14px calc(26px + env(safe-area-inset-bottom)); background:var(--surface); scrollbar-width:none; }
    #content::-webkit-scrollbar { display:none; }
    .status-row { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:13px; }
    .device-meta strong,.device-meta span { display:block; }.device-meta strong { font-size:15px; line-height:22px; }.device-meta span { color:var(--muted); font-size:11px; line-height:17px; }
    .online { flex:none; margin-top:4px; display:inline-flex; align-items:center; gap:6px; color:#247b55; font-size:11px; font-weight:700; }.online::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--online); }
    .timeline { height:45px; margin-bottom:16px; padding:0 12px; display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px; border:1px solid var(--line); border-radius:6px; background:var(--paper); color:var(--muted); font-size:10px; }
    .track { position:relative; height:2px; background:#dfe3e0; }.track::before { content:""; position:absolute; inset:0 28% 0 0; background:var(--ink); }.track::after { content:""; position:absolute; left:72%; top:50%; width:8px; height:8px; border:2px solid #fff; border-radius:50%; background:var(--ink); box-shadow:0 0 0 1px var(--ink); transform:translate(-50%,-50%); }
    .section-label { margin:0 0 9px; color:var(--muted); font-size:11px; line-height:16px; font-weight:700; }
    .quick-actions { margin-bottom:17px; display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    .action { min-width:0; height:72px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; border:1px solid var(--line); border-radius:6px; background:var(--paper); color:var(--ink); font-size:11px; font-weight:600; transition:transform .12s ease,background .14s ease; }.action .icon { width:20px; height:20px; }
    .ptz { min-height:138px; padding:12px; display:grid; grid-template-columns:142px 1fr; align-items:center; gap:16px; border:1px solid var(--line); border-radius:6px; background:var(--paper); }
    .dpad { width:122px; height:108px; justify-self:center; display:grid; grid-template:repeat(3,36px)/repeat(3,36px); place-content:center; }
    .dpad button { display:grid; place-items:center; background:#f0f2f0; color:#3f4542; font-size:16px; }.dpad button:active { background:#dde3df; }.dpad .up { grid-column:2; border-radius:5px 5px 0 0; }.dpad .left { grid-row:2; grid-column:1; border-radius:5px 0 0 5px; }.dpad .center { grid-row:2; grid-column:2; border-radius:50%; background:var(--ink); color:#fff; transform:scale(.72); }.dpad .right { grid-row:2; grid-column:3; border-radius:0 5px 5px 0; }.dpad .down { grid-row:3; grid-column:2; border-radius:0 0 5px 5px; }
    .zoom strong { display:block; margin-bottom:5px; font-size:13px; }.zoom p { margin:0 0 14px; color:var(--muted); font-size:10px; line-height:16px; }.stepper { height:38px; display:grid; grid-template-columns:38px 1fr 38px; overflow:hidden; border:1px solid var(--line); border-radius:5px; }.stepper span { display:grid; place-items:center; border-inline:1px solid var(--line); font-size:11px; font-weight:700; }.step-button { background:#f6f7f6; font-size:18px; }
    #toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); z-index:30; max-width:calc(100% - 40px); padding:10px 14px; border-radius:6px; background:rgba(20,23,22,.93); color:#fff; font-size:12px; white-space:nowrap; opacity:0; pointer-events:none; transform:translate(-50%,14px); transition:opacity .16s ease,transform .18s ease; }#toast.show { opacity:1; transform:translate(-50%,0); }
    .controls-hidden .video-top { opacity:0; transform:translateY(-6px); pointer-events:none; }.controls-hidden .video-bottom { opacity:0; transform:translateY(6px); pointer-events:none; }
    #app.is-fullscreen #header,#app.is-fullscreen #content { display:none; }#app.is-fullscreen #viewer { flex:1; height:100%; min-height:0; }#app.is-fullscreen #video { object-fit:contain; }#app.is-fullscreen #placeholder { object-fit:contain; }
    #app.is-fullscreen .normal-live { display:none; }
    #app.is-fullscreen .fullscreen-only { display:inline-flex; }
    #app.is-fullscreen #fullscreenBack { display:grid; background:rgba(12,15,14,.54); backdrop-filter:blur(8px); }
    #app.is-fullscreen .video-top,#app.is-fullscreen .video-bottom { left:max(14px,env(safe-area-inset-left)); right:max(14px,env(safe-area-inset-right)); }
    @media (max-height:680px) { #viewer { min-height:190px; flex-basis:240px; } .action { height:64px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition-duration:.01ms!important; animation-duration:.01ms!important; } }
  </style>
</head>
<body>
  <main id="app">
    <header id="header">
      <button class="icon-button" id="backBtn" aria-label="返回"><svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="title"><strong>客厅摄像头</strong><span>滨江公寓 · 01号设备</span></div>
      <button class="icon-button js-tip" data-tip="设备设置将在完整版本中开放" aria-label="更多设置"><svg class="icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
    </header>
    <section id="viewer">
      <video id="video" playsinline webkit-playsinline></video>
      <img id="placeholder" src="./monitor-office.jpg" alt="客厅摄像头画面">
      <div id="shade"></div><div id="tapLayer"></div><div id="tip"></div>
      <div id="cover"><button id="coverPlay" aria-label="播放直播"><svg class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button><span id="coverText">点击播放实时画面</span></div>
      <div id="loading"><div id="spinner"></div><span id="loadingText">正在连接直播...</span></div>
      <div class="video-top"><button class="icon-button fullscreen-only" id="fullscreenBack" aria-label="返回"><svg class="icon" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><span class="pill normal-live"><span class="live-dot"></span>实时</span><button class="pill js-tip" data-tip="当前画质：高清 1080P">高清 1080P</button></div>
      <div class="video-bottom"><div class="video-meta"><span id="timestamp">2026-08-14&nbsp;&nbsp;19:42:18</span><span class="pill fullscreen-only"><span class="live-dot"></span>实时</span></div><div class="video-actions">
        <button class="icon-button" id="playBtn" aria-label="播放或暂停"><svg id="playIcon" class="icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/></svg><svg id="pauseIcon" class="icon" viewBox="0 0 24 24" style="display:none"><path d="M7 5v14M17 5v14"/></svg></button>
        <button class="icon-button" id="fullscreenBtn" aria-label="全屏"><svg id="fsEnter" class="icon" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></svg><svg id="fsExit" class="icon" viewBox="0 0 24 24" style="display:none"><path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"/></svg></button>
      </div></div>
    </section>
    <section id="content">
      <div class="status-row"><div class="device-meta"><strong>客厅 · 主视角</strong><span>连接稳定 · 延迟 0.8 秒</span></div><span class="online">设备在线</span></div>
      <div class="timeline"><span>19:30</span><div class="track"></div><span>现在</span></div>
      <p class="section-label">快捷操作</p>
      <div class="quick-actions">
        <button class="action js-tip" data-tip="截图功能等待业务接口接入"><svg class="icon" viewBox="0 0 24 24"><path d="M14.5 4 16 7h4v12H4V7h4l1.5-3z"/><circle cx="12" cy="13" r="3"/></svg><span>截图</span></button>
        <button class="action js-tip" data-tip="录像功能等待业务接口接入"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/></svg><span>录像</span></button>
        <button class="action js-tip" data-tip="对讲功能等待业务接口接入"><svg class="icon" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg><span>对讲</span></button>
        <button class="action js-tip" data-tip="回放功能等待业务接口接入"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>回放</span></button>
      </div>
      <p class="section-label">云台控制</p>
      <div class="ptz"><div class="dpad"><button class="up js-tip" data-tip="摄像头向上移动">↑</button><button class="left js-tip" data-tip="摄像头向左移动">←</button><button class="center js-tip" data-tip="云台回到中心">●</button><button class="right js-tip" data-tip="摄像头向右移动">→</button><button class="down js-tip" data-tip="摄像头向下移动">↓</button></div><div class="zoom"><strong>画面缩放</strong><p>也可在画面上双指缩放</p><div class="stepper"><button class="step-button js-tip" data-tip="画面已缩小">−</button><span id="zoomValue">1.0×</span><button class="step-button js-tip" data-tip="画面已放大">+</button></div></div></div>
    </section>
    <div id="toast" role="status"></div>
  </main>
  <script src="./uni.webview.1.5.8.js"></script><script src="./flv.min.js"></script>
  <script>
    (function(){
      var app=document.getElementById('app'),video=document.getElementById('video'),placeholder=document.getElementById('placeholder'),cover=document.getElementById('cover'),loading=document.getElementById('loading'),tip=document.getElementById('tip'),toast=document.getElementById('toast');
      var playIcon=document.getElementById('playIcon'),pauseIcon=document.getElementById('pauseIcon'),fsEnter=document.getElementById('fsEnter'),fsExit=document.getElementById('fsExit');
      var flvUrl='https://srs.unsj.edu.ar/live/xama/xama.flv',player=null,retryTimer=null,retryCount=0,started=false,isPlaying=false,isFullscreen=false,controlsVisible=true,hideTimer=null,toastTimer=null;
      function notify(type,detail){try{if(window.uni&&window.uni.postMessage)window.uni.postMessage({data:{type:type,detail:detail}})}catch(e){}}
      function showToast(text){clearTimeout(toastTimer);toast.textContent=text;toast.classList.add('show');toastTimer=setTimeout(function(){toast.classList.remove('show')},1700)}
      function showTip(text){tip.textContent=text||'';tip.style.display=text?'block':'none'}
      function showCover(){cover.style.display='flex';placeholder.style.display='block';hideLoading()}
      function hideCover(){cover.style.display='none';placeholder.style.display='none'}
      function showLoading(){cover.style.display='none';placeholder.style.display='block';loading.style.display='flex'} function hideLoading(){loading.style.display='none'}
      function setPlayIcon(){playIcon.style.display=isPlaying?'none':'';pauseIcon.style.display=isPlaying?'':'none'}
      function clearAutoHide(){if(hideTimer){clearTimeout(hideTimer);hideTimer=null}}
      function showControls(){controlsVisible=true;app.classList.remove('controls-hidden');scheduleAutoHide()}
      function hideControls(){controlsVisible=false;app.classList.add('controls-hidden');clearAutoHide()}
      function scheduleAutoHide(){clearAutoHide();if(isPlaying)hideTimer=setTimeout(hideControls,3000)}
      function destroyPlayer(){if(!player)return;try{player.pause();player.unload();player.detachMediaElement();player.destroy()}catch(e){}player=null}
      function createPlayer(){if(!window.flvjs||!window.flvjs.isSupported()){showTip('当前浏览器内核不支持 FLV 播放');showCover();notify('unsupported');return}destroyPlayer();showTip('');showLoading();player=window.flvjs.createPlayer({type:'flv',isLive:true,url:flvUrl},{enableStashBuffer:false,stashInitialSize:128,autoCleanupSourceBuffer:true});player.attachMediaElement(video);video.addEventListener('loadeddata',hideLoading,{once:true});player.on(window.flvjs.Events.ERROR,function(type,detail){notify('error',{errType:type,errDetail:detail});isPlaying=false;setPlayIcon();showControls();showCover();scheduleRetry()});player.load();player.play().then(onPlaySuccess).catch(onPlayError)}
      function onPlaySuccess(){retryCount=0;isPlaying=true;setPlayIcon();hideCover();hideLoading();scheduleAutoHide();notify('play_success')}
      function onPlayError(err){isPlaying=false;setPlayIcon();showControls();showCover();notify('play_rejected',String(err))}
      function scheduleRetry(){if(!started||retryTimer||retryCount>=5)return;retryCount++;showTip('连接中断，正在重试 ('+retryCount+'/5)...');retryTimer=setTimeout(function(){retryTimer=null;createPlayer()},2000)}
      function startPlay(){started=true;if(!player)createPlayer();else{showLoading();player.play().then(onPlaySuccess).catch(onPlayError)}}
      function pausePlay(){if(player)player.pause();isPlaying=false;setPlayIcon();showControls();notify('paused')}
      function togglePlay(){isPlaying?pausePlay():startPlay()}
      function requestFullscreen(){var fn=app.requestFullscreen||app.webkitRequestFullscreen;if(!fn){notify('fullscreen_unsupported');return}try{var result=fn.call(app);if(result&&result.catch)result.catch(function(err){notify('fullscreen_error',String(err))})}catch(err){notify('fullscreen_error',String(err))}}
      function exitFullscreen(){var fn=document.exitFullscreen||document.webkitExitFullscreen;if(!fn)return;try{var result=fn.call(document);if(result&&result.catch)result.catch(function(err){notify('fullscreen_error',String(err))})}catch(err){notify('fullscreen_error',String(err))}}
      function toggleFullscreen(){isFullscreen?exitFullscreen():requestFullscreen()}
      function updateOrientationPolicy(){var orientation=screen.orientation;if(!orientation)return;try{if(isFullscreen&&orientation.unlock)orientation.unlock();else if(!isFullscreen&&orientation.lock){var result=orientation.lock('portrait');if(result&&result.catch)result.catch(function(){})}}catch(e){}}
      function onFullscreenChange(){isFullscreen=!!(document.fullscreenElement||document.webkitFullscreenElement);app.classList.toggle('is-fullscreen',isFullscreen);fsEnter.style.display=isFullscreen?'none':'';fsExit.style.display=isFullscreen?'':'none';updateOrientationPolicy();notify(isFullscreen?'fullscreen_enter':'fullscreen_exit');showControls()}
      function setExternalFullscreen(enabled){isFullscreen=enabled;app.classList.toggle('is-fullscreen',enabled);fsEnter.style.display=enabled?'none':'';fsExit.style.display=enabled?'':'none';showControls()}
      function requestAppFullscreen(enabled){if(window.plus||/Html5Plus/i.test(navigator.userAgent)){setExternalFullscreen(enabled);try{if(window.plus){if(enabled){plus.screen.unlockOrientation();plus.navigator.setFullscreen(true)}else{plus.screen.lockOrientation('portrait-primary');plus.navigator.setFullscreen(false)}}}catch(e){}notify(enabled?'request_fullscreen_enter':'request_fullscreen_exit');return}enabled?requestFullscreen():exitFullscreen()}
      function requestAppBack(){try{if(window.plus){plus.screen.lockOrientation('portrait-primary');plus.navigator.setFullscreen(false)}}catch(e){}if(window.uni&&window.uni.webView)window.uni.webView.navigateBack();else notify('request_back')}
      document.getElementById('backBtn').addEventListener('click',requestAppBack);
      document.getElementById('playBtn').addEventListener('click',function(e){e.stopPropagation();togglePlay()});document.getElementById('coverPlay').addEventListener('click',startPlay);document.getElementById('tapLayer').addEventListener('click',function(){controlsVisible?hideControls():showControls()});
      document.getElementById('fullscreenBack').addEventListener('click',function(e){e.stopPropagation();requestAppBack()});document.getElementById('fullscreenBtn').addEventListener('click',function(e){e.stopPropagation();requestAppFullscreen(!isFullscreen)});document.addEventListener('fullscreenchange',onFullscreenChange);document.addEventListener('webkitfullscreenchange',onFullscreenChange);
      window.addEventListener('uni-app-command',function(e){var action=e&&e.detail&&e.detail.action;if(action==='fullscreen_enter')setExternalFullscreen(true);else if(action==='fullscreen_exit')setExternalFullscreen(false)});
      Array.prototype.forEach.call(document.querySelectorAll('.js-tip'),function(el){el.addEventListener('click',function(){showToast(el.getAttribute('data-tip'))})});
      function readQuery(){try{var params=new URLSearchParams(location.search),url=params.get('url'),status=parseFloat(params.get('statusBarHeight')||'0');if(url)flvUrl=decodeURIComponent(url);if(status>0)document.documentElement.style.setProperty('--status',status+'px')}catch(e){}}readQuery();
      function updateTime(){var now=new Date(),pad=function(v){return String(v).padStart(2,'0')};document.getElementById('timestamp').textContent=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate())+'  '+pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds())}updateTime();setInterval(updateTime,1000);
      notify('ready');
      document.addEventListener('UniAppJSBridgeReady',function(){notify('ready')});
      document.addEventListener('visibilitychange',function(){if(!started||!player)return;if(document.hidden)player.pause();else player.play().catch(function(){})});
    })();
  </script>
</body>
</html>
